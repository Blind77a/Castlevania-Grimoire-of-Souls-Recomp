; GoSRecomp settings
[game]
; Game language at the very first start. Empty = your Windows display language.
; After that the game keeps its own setting: change it in the game's options.
; ja-JP en-US en-GB fr-FR fr-CA it-IT de-DE es-MX es-ES ko-KR zh-TW zh-CN pt-BR ru-RU tr-TR ar-SA
language=
; 1 = skip the Apple Arcade movie and the Konami logo. The title menu stays,
; and Continue is usable before the fade-in and logo shine. 0 shows the logos too.
skip_intro=1

[display]
; Frame rate cap: 30, 60, 120, 144, 165, 240... or 0 for no cap. Empty = the game's own (60).
; Above 60 is untested by the game's makers: if anything runs too fast, go back to 60.
fps=
; 1 = wait for the monitor's refresh (no tearing), 0 = don't. Empty: vsync only on 60/120/180/240 Hz
; monitors, where it gives 60 fps; on 75/144/165 Hz ones the game is capped at 60 instead.
; The game was made for 60 fps: above that, attacks can miss and some effects vanish.
vsync=
; fullscreen, borderless or windowed. Empty = as last time.
mode=
; Size for the modes above. Empty = your screen's size (windowed: 3/4 of it).
width=
height=
; Monitor refresh rate in Hz while the game runs, e.g. 60. Only with mode=fullscreen
; (exclusive fullscreen); Windows puts your usual rate back when the game closes.
; Empty = your desktop's refresh rate.
refresh=
; How many frames the game may prepare ahead of the screen, 1 to 3. Each one is a
; frame (about 16 ms) between pressing a button and seeing it. 1 = controls react
; sooner, but a slow frame shows as a small hitch when the level scrolls.
; Empty = Unity's own (2).
frame_queue=
;
; Most responsive controls (all optional, the game runs fine without them):
;   mode=fullscreen   exclusive fullscreen skips the Windows desktop compositor
;   refresh=60        the game runs at 60 fps, so a 60 Hz screen paces it evenly
;   vsync=0           no waiting for the screen (may show a tear line when moving)
;   frame_queue=1     no frames queued up between your press and the screen
; If scrolling hitches, try vsync=1 first, then frame_queue=2.

[controller]
; Controller tables: pc (the game's Windows ones) or mac (what the macOS build used:
; on Windows, PlayStation controllers then scroll menus by themselves).
layout=pc
; The d-pad moves your character too, like the left stick. 0 turns it off.
dpad_move=1
; Xbox controllers are seen as gamepads by Unity's Input System (LT/RT, menus,
; button icons). 0 turns that off if your Xbox controller misbehaves.
xinput=1
; Controllers other than PlayStation and Xbox (Switch Pro, 8BitDo in Switch mode...)
; are read through their standard buttons. 0 = off, 2 = use it for every controller.
standard=1
; Auto input: in battle, holding attack, jump or sub-weapon repeats the press (1 = on).
; Also set in the debug menu (Auto input). Characters that charge an attack by holding
; the button (Maria, for one) repeat instead of charging while it is on.
auto_attack=0
auto_jump=0
auto_subweapon=0
; Presses a second while held: 6, 10 or 15.
auto_speed=10

[effects]
; Experimental: 1 tries to fix effects drawn upside down in some screens.
; It also flips some effects that were right (the tap effect), so it is off.
flip_fix=0

[debug]
; F8 (or clicking both sticks, L3 + R3) opens the debug menu in the game.
; menu=0 turns it off; hotkey= takes F1-F12 or a virtual-key code.
menu=1
hotkey=F8
; 1 = the old debug menu in a separate window instead (not shown in exclusive fullscreen).
window=0

[mouse]
; Mouse buttons can be bound in the game's keyboard options (shown as Mouse L / R / M / 4 / 5). 0 = off.
buttons=1
